name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "cmake;3.22.1"             "ndk;26.3.11579264"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          arguments: ":app:assembleDebug --stacktrace --no-daemon"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MCPE26-ImGui-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: MCPE26-Native-arm64
          path: app/build/intermediates/stripped_native_libs/debug/out/lib/arm64-v8a/libmodmenu.so
          if-no-files-found: error
