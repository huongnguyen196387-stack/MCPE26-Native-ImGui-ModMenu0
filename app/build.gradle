plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.mcpeimgui'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.mcpeimgui'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake { cppFlags '-std=c++20 -fexceptions -frtti' }
        }
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
